<html lang="zh-Hant">
<head>

<style>
:root{--ink:#202437;--muted:#81869a;--line:#eceef4;--paper:#fff;--bg:#f7f8fc;--purple:#7969e8;--pale:#f0edff;--mint:#e8f6ef;--orange:#fff2df;--shadow:0 12px 35px #303b6510}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;min-height:100vh}.app{max-width:1440px;margin:auto;padding:26px 34px 42px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:20px;letter-spacing:.2px}.brandmark{width:39px;height:39px;border-radius:13px;background:var(--purple);display:grid;place-items:center;color:white;font-size:19px;box-shadow:0 6px 13px #7969e844}.brand small{display:block;font-size:11px;color:#a0a3b2;letter-spacing:1.5px;font-weight:600;margin-top:1px}.righttop{display:flex;align-items:center;gap:13px}.today-pill{color:#777b8d;font-size:13px}.avatar{width:36px;height:36px;border-radius:50%;background:#f4d6c5;color:#8b5841;display:grid;place-items:center;font-size:13px;font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1fr) 335px;gap:24px;align-items:start}.maincol{min-width:0}.greeting{margin:0 0 22px;font-size:25px;letter-spacing:-.6px}.greeting span{color:var(--muted);font-weight:450}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:21px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:17px 19px;display:flex;align-items:center;gap:14px}.stat-ico{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;font-size:19px}.lav{background:var(--pale)}.green{background:var(--mint)}.peach{background:var(--orange)}.stat-label{font-size:12px;color:var(--muted);margin-bottom:5px}.stat-num{font-size:22px;font-weight:750;line-height:1}.stat-num small{font-size:12px;font-weight:550;color:#989cad;margin-left:4px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px 23px;box-shadow:var(--shadow)}.calendar-panel{min-height:515px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.panel-title{font-size:16px;font-weight:720}.monthnav{display:flex;align-items:center;gap:13px}.month-label{font-size:14px;font-weight:650;min-width:115px;text-align:center}.icon-btn{border:0;background:#f6f6fa;color:#656a7b;border-radius:9px;width:31px;height:31px;cursor:pointer;font-size:17px}.view-toggle{display:flex;background:#f4f4f8;padding:3px;border-radius:10px;gap:2px}.view-toggle button{border:0;background:transparent;color:#898da0;border-radius:8px;padding:7px 13px;font-size:12px;cursor:pointer}.view-toggle button.active{background:white;color:var(--ink);box-shadow:0 1px 4px #252b4014;font-weight:650}.calendar{display:grid;grid-template-columns:repeat(7,1fr)}.dow{text-align:center;color:#a1a4b2;font-size:11px;padding:4px 0 12px}.day{height:73px;border-top:1px solid #f0f1f5;padding:8px 7px 4px;cursor:pointer;position:relative}.day:hover{background:#faf9ff}.day.other{color:#c6c8d1}.day.selected{background:#f6f4ff}.day.selected .date-num{background:var(--purple);color:white}.date-num{font-size:12px;width:25px;height:25px;display:grid;place-items:center;border-radius:50%;margin:0 auto 3px}.day.today .date-num{border:1px solid var(--purple);color:var(--purple);font-weight:700}.dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}.dot{width:5px;height:5px;border-radius:50%;background:var(--purple)}.dot.task{background:#55b88b}.dot.exam{background:#f0a54a}.legend{display:flex;gap:16px;color:#9296a5;font-size:11px;margin-top:14px}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:7px;height:7px;border-radius:50%;background:var(--purple)}.legend .l-task{background:#55b88b}.legend .l-exam{background:#f0a54a}.side{display:flex;flex-direction:column;gap:17px}.side .panel{padding:20px}.side-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.side-head h2{font-size:15px;margin:0}.text-btn{border:0;background:none;color:var(--purple);font-weight:650;font-size:12px;cursor:pointer}.next-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f0f1f5;cursor:pointer}.next-item:last-child{border:0;padding-bottom:2px}.datebox{width:43px;height:48px;border-radius:12px;background:#f5f2ff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;color:var(--purple)}.datebox strong{font-size:17px;line-height:1}.datebox small{font-size:10px;margin-top:4px}.event-name{font-size:13px;font-weight:680;margin:3px 0 5px}.event-meta{font-size:11px;color:#999dad}.tag{font-size:10px;border-radius:6px;padding:3px 7px;background:#fff2df;color:#c18032;margin-left:6px}.tag.task{background:#e8f6ef;color:#41966f}.task-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f0f1f5}.task-row:last-child{border:0;padding-bottom:0}.check{appearance:none;width:17px;height:17px;border:1.5px solid #d4d6e0;border-radius:6px;cursor:pointer;margin:1px 0 0;flex:none}.check:checked{background:var(--purple);border-color:var(--purple)}.check:checked:after{content:'✓';display:block;text-align:center;color:white;font-size:12px;line-height:15px}.task-name{font-size:12px;font-weight:620}.task-due{font-size:10px;color:#a0a3b0;margin-top:4px}.task-copy.done .task-name{text-decoration:line-through;color:#a9abb6}.task-copy.done .task-due{color:#c3c5cd}.empty{padding:18px 4px;text-align:center;color:#a0a3b0;font-size:12px}.fab{position:fixed;right:38px;bottom:33px;border:0;background:var(--purple);color:white;border-radius:15px;padding:14px 20px;font-weight:680;font-size:14px;box-shadow:0 8px 24px #7969e84c;cursor:pointer;display:flex;align-items:center;gap:9px}.fab:hover{transform:translateY(-2px);box-shadow:0 12px 26px #7969e859}.fab b{font-size:19px;font-weight:400;line-height:14px}.list-view{display:none;min-height:515px}.list-day{padding:12px 0;border-bottom:1px solid var(--line)}.list-date{font-size:12px;font-weight:700;color:#7e8294;margin-bottom:6px}.list-entry{padding:7px 10px;border-radius:9px;background:#f8f7ff;margin:5px 0;font-size:12px;display:flex;justify-content:space-between;cursor:pointer}.list-entry.task{background:#f1faf5}.list-entry.exam{background:#fff8ee}.modal-backdrop{position:fixed;inset:0;background:#1b1c2b66;display:none;align-items:center;justify-content:center;padding:18px;z-index:4}.modal-backdrop.show{display:flex}.modal{width:min(470px,100%);background:white;border-radius:22px;padding:25px;box-shadow:0 20px 60px #10132235}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.modal-head h2{font-size:18px;margin:0}.close{border:0;background:#f5f5f8;width:31px;height:31px;border-radius:9px;cursor:pointer;font-size:19px;color:#777}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:650;color:#656a7a;margin:0 0 7px}.field input,.field select,.field textarea{width:100%;border:1px solid #e4e6ee;border-radius:10px;padding:11px 12px;font:inherit;font-size:13px;outline:none;background:#fff;color:var(--ink)}.field input:focus,.field select:focus,.field textarea:focus{border-color:#a49af0;box-shadow:0 0 0 3px #7969e818}.field textarea{resize:vertical;min-height:65px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.helper{font-size:10px;color:#a1a4b1;margin-top:6px}.modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.delete-btn{border:0;background:none;color:#d25c65;cursor:pointer;font-size:12px}.save-btn{border:0;background:var(--purple);color:white;padding:11px 20px;border-radius:10px;font-weight:650;cursor:pointer}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;transition:.25s;background:#26293a;color:white;padding:11px 17px;border-radius:10px;font-size:12px;pointer-events:none;z-index:6}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.app{padding:22px}.day{height:68px}.fab{right:22px;bottom:20px}}@media(max-width:560px){.app{padding:17px 14px 90px}.topbar{margin-bottom:23px}.today-pill{display:none}.brand{font-size:18px}.greeting{font-size:21px;margin-bottom:17px}.summary{gap:7px}.stat{padding:12px 9px;gap:8px;border-radius:14px;min-height:78px}.stat-ico{width:34px;height:34px;border-radius:11px;font-size:15px}.stat-label{font-size:10px}.stat-num{font-size:18px}.stat-num small{font-size:10px}.layout{gap:13px}.panel{padding:16px 13px;border-radius:17px}.calendar-panel{min-height:0}.panel-head{flex-wrap:wrap;margin-bottom:14px}.panel-title{font-size:14px}.monthnav{gap:7px}.month-label{font-size:12px;min-width:94px}.icon-btn{width:28px;height:28px}.view-toggle button{padding:6px 9px;font-size:11px}.day{height:57px;padding:5px 1px}.date-num{font-size:11px;width:22px;height:22px}.dow{font-size:10px;padding-bottom:8px}.legend{gap:10px;font-size:10px;margin-top:10px}.side{grid-template-columns:1fr;gap:12px}.side .panel{padding:16px}.fab{right:17px;bottom:16px;padding:13px 17px}.form-row{grid-template-columns:1fr 1fr}.list-view{min-height:0}}
</style></head>
<body><div class="app"><header class="topbar"><div class="brand"><div class="brandmark">✦</div><div>拾光<small>行程與任務</small></div></div><div class="righttop"><div class="today-pill" id="topDate"></div><div class="avatar">我</div></div></header><main class="layout"><section class="maincol"><h1 class="greeting" id="greeting">早安，<span>把重要的事安排好。</span></h1><div class="summary"><div class="stat"><div class="stat-ico lav">◷</div><div><div class="stat-label">本週行程</div><div class="stat-num" id="weekEvents">0<small>項</small></div></div></div><div class="stat"><div class="stat-ico green">✓</div><div><div class="stat-label">待完成任務</div><div class="stat-num" id="pendingTasks">0<small>項</small></div></div></div><div class="stat"><div class="stat-ico peach">✦</div><div><div class="stat-label">即將到來</div><div class="stat-num" id="upcoming">0<small>項</small></div></div></div></div><section class="panel calendar-panel" id="calendarPanel"><div class="panel-head"><div class="panel-title">行事曆</div><div class="monthnav"><button class="icon-btn" id="prev">‹</button><div class="month-label" id="monthLabel"></div><button class="icon-btn" id="next">›</button></div><div class="view-toggle"><button class="active" data-view="calendar">月曆</button><button data-view="list">清單</button></div></div><div id="calendarView"><div class="calendar" id="calendar"></div><div class="legend"><span><i></i>行程</span><span><i class="l-exam"></i>考試</span><span><i class="l-task"></i>任務</span></div></div><div class="list-view" id="listView"></div></section></section><aside class="side"><section class="panel"><div class="side-head"><h2>接下來</h2><button class="text-btn" id="showAll">查看全部</button></div><div id="upcomingList"></div></section><section class="panel"><div class="side-head"><h2>準備事項</h2><button class="text-btn" id="addTask">＋ 新增</button></div><div id="taskList"></div></section></aside></main></div><button class="fab" id="create"><b>＋</b> 新增項目</button>
<div class="modal-backdrop" id="backdrop"><form class="modal" id="entryForm"><div class="modal-head"><h2 id="modalTitle">新增項目</h2><button type="button" class="close" id="close">×</button></div><input type="hidden" id="entryId"><div class="field"><label for="name">名稱 *</label><input id="name" required maxlength="80" placeholder="例如：微積分期中考"></div><div class="form-row"><div class="field"><label for="type">項目類型</label><select id="type"><option value="event">一般行程</option><option value="exam">考試</option><option value="task">準備任務</option></select></div><div class="field"><label for="date">日期 *</label><input id="date" type="date" required></div></div><div class="form-row" id="timeRow"><div class="field"><label for="time">時間（選填）</label><input id="time" type="time"></div><div class="field" id="dueWrap" style="display:none"><label for="due">最晚完成日</label><input id="due" type="date"><div class="helper">可提早完成，記得勾選任務狀態</div></div></div><div class="field"><label for="notes">備註（選填）</label><textarea id="notes" maxlength="240" placeholder="地點、準備內容或其他提醒"></textarea></div><div class="modal-actions"><button type="button" class="delete-btn" id="delete" style="visibility:hidden">刪除此項目</button><button class="save-btn" type="submit">儲存</button></div></form></div><div class="toast" id="toast"></div>
<script>
(()=>{const KEY='shiguang-planner-v1';const pad=n=>String(n).padStart(2,'0');const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const now=new Date();let cursor=new Date(now.getFullYear(),now.getMonth(),1),selected=iso(now),view='calendar';let items=[];try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}
if(!items.length){const yy=now.getFullYear(),mm=pad(now.getMonth()+1);const sample=(day,name,type,extra={})=>({id:crypto.randomUUID(),name,type,date:`${yy}-${mm}-${pad(day)}`,...extra});let d=Math.min(now.getDate()+2,27);items=[sample(d,'微積分期中考','exam',{time:'10:10',notes:'第二教學大樓 204'}),sample(Math.min(d+4,28),'英文報告繳交','event',{notes:'上傳至課程平台'}),sample(Math.min(d+1,28),'確認返鄉車票','task',{due:`${yy}-${mm}-${pad(d)}`}),sample(Math.min(d+6,29),'完成統計學作業','task',{due:`${yy}-${mm}-${pad(d+5)}`})];save()}
function save(){localStorage.setItem(KEY,JSON.stringify(items))}const fmtDate=(s,opt={month:'short',day:'numeric'})=>new Intl.DateTimeFormat('zh-TW',opt).format(new Date(s+'T00:00:00'));const typeName=t=>t==='exam'?'考試':t==='task'?'任務':'行程';function initDate(){document.getElementById('topDate').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(now);document.getElementById('greeting').innerHTML=`${now.getHours()<12?'早安':now.getHours()<18?'午安':'晚安'}，<span>把重要的事安排好。</span>`}
function render(){document.getElementById('monthLabel').textContent=`${cursor.getFullYear()} 年 ${cursor.getMonth()+1} 月`;renderCalendar();renderSide();renderList();renderStats()}
function renderCalendar(){const el=document.getElementById('calendar');el.innerHTML='';['日','一','二','三','四','五','六'].forEach(x=>{let e=document.createElement('div');e.className='dow';e.textContent=x;el.append(e)});const first=new Date(cursor.getFullYear(),cursor.getMonth(),1),start=new Date(first);start.setDate(first.getDate()-first.getDay());for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=iso(d);const day=document.createElement('div');day.className='day'+(d.getMonth()!==cursor.getMonth()?' other':'')+(ds===iso(now)?' today':'')+(ds===selected?' selected':'');day.innerHTML=`<div class="date-num">${d.getDate()}</div><div class="dots"></div>`;const dayItems=items.filter(x=>(x.type==='task'?x.due||x.date:x.date)===ds);const dots=day.querySelector('.dots');dayItems.slice(0,5).forEach(x=>{const dot=document.createElement('i');dot.className='dot'+(x.type==='task'?' task':x.type==='exam'?' exam':'');dots.append(dot)});day.addEventListener('click',()=>{selected=ds;renderCalendar();showSelected(ds)});el.append(day)}}
function showSelected(ds){const arr=items.filter(x=>(x.type==='task'?x.due||x.date:x.date)===ds);if(!arr.length){openModal({date:ds});return}document.getElementById('listView').style.display='block';document.getElementById('calendarView').style.display='none';document.querySelectorAll('.view-toggle button').forEach(b=>b.classList.toggle('active',b.dataset.view==='list'));view='list';renderList(ds)}
function renderList(only=null){const box=document.getElementById('listView');const ev=items.filter(x=>!x.done).slice().sort((a,b)=>(a.type==='task'?a.due||a.date:a.date).localeCompare(b.type==='task'?b.due||b.date:b.date));const groups={};ev.forEach(x=>{const d=x.type==='task'?x.due||x.date:x.date;if(only&&d!==only)return;(groups[d]??=[]).push(x)});box.innerHTML=Object.keys(groups).length?Object.keys(groups).sort().map(d=>`<div class="list-day"><div class="list-date">${fmtDate(d,{month:'long',day:'numeric',weekday:'short'})}</div>${groups[d].map(x=>`<div class="list-entry ${x.type}" data-id="${x.id}"><span>${escapeHtml(x.name)} <small style="color:#9599a9">· ${typeName(x.type)}</small></span><span>${x.time||''}</span></div>`).join('')}</div>`).join(''):`<div class="empty">${only?'這一天目前沒有安排':'尚無待處理項目，新增一項開始規劃吧。'}</div>`;box.querySelectorAll('.list-entry').forEach(e=>e.onclick=()=>openModal(items.find(x=>x.id===e.dataset.id)))}
function renderSide(){const upcoming=items.filter(x=>x.type!=='task'&&!x.done&&x.date>=iso(now)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);const ul=document.getElementById('upcomingList');ul.innerHTML=upcoming.length?upcoming.map(x=>`<div class="next-item" data-id="${x.id}"><div class="datebox"><strong>${new Date(x.date+'T00:00:00').getDate()}</strong><small>${new Intl.DateTimeFormat('zh-TW',{month:'short'}).format(new Date(x.date+'T00:00:00'))}</small></div><div><div class="event-name">${escapeHtml(x.name)}<span class="tag ${x.type==='exam'?'':'task'}">${typeName(x.type)}</span></div><div class="event-meta">${x.time||'全天'}${x.notes?' · '+escapeHtml(x.notes):''}</div></div></div>`).join(''):'<div class="empty">目前沒有即將到來的行程</div>';ul.querySelectorAll('.next-item').forEach(e=>e.onclick=()=>openModal(items.find(x=>x.id===e.dataset.id)));const tasks=items.filter(x=>x.type==='task').sort((a,b)=>(a.due||a.date).localeCompare(b.due||b.date)).slice(0,5);const tl=document.getElementById('taskList');tl.innerHTML=tasks.length?tasks.map(x=>`<div class="task-row"><input class="check" type="checkbox" ${x.done?'checked':''} data-id="${x.id}"><div class="task-copy ${x.done?'done':''}" data-id="${x.id}"><div class="task-name">${escapeHtml(x.name)}</div><div class="task-due">${x.done?'已完成':`最晚 ${fmtDate(x.due||x.date,{month:'short',day:'numeric'})}`}</div></div></div>`).join(''):'<div class="empty">還沒有準備任務</div>';tl.querySelectorAll('.check').forEach(c=>c.onchange=()=>{const x=items.find(i=>i.id===c.dataset.id);x.done=c.checked;save();render();toast(c.checked?'已完成任務':'已恢復任務')});tl.querySelectorAll('.task-copy').forEach(c=>c.onclick=()=>openModal(items.find(i=>i.id===c.dataset.id)))}
function renderStats(){const weekEnd=new Date(now);weekEnd.setDate(now.getDate()+7);const week=items.filter(x=>x.type!=='task'&&!x.done&&x.date>=iso(now)&&x.date<iso(weekEnd)).length;const pending=items.filter(x=>x.type==='task'&&!x.done).length;const upcoming=items.filter(x=>!x.done&&x.date>=iso(now)&&x.date<=iso(new Date(now.getTime()+14*864e5))).length;document.getElementById('weekEvents').innerHTML=`${week}<small>項</small>`;document.getElementById('pendingTasks').innerHTML=`${pending}<small>項</small>`;document.getElementById('upcoming').innerHTML=`${upcoming}<small>項</small>`}
function escapeHtml(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const $=id=>document.getElementById(id);function openModal(x={}){$('entryForm').reset();$('entryId').value=x.id||'';$('name').value=x.name||'';$('type').value=x.type||'event';$('date').value=x.date||selected;$('time').value=x.time||'';$('due').value=x.due||'';$('notes').value=x.notes||'';$('modalTitle').textContent=x.id?'編輯項目':'新增項目';$('delete').style.visibility=x.id?'visible':'hidden';$('dueWrap').style.display=$('type').value==='task'?'block':'none';$('backdrop').classList.add('show');setTimeout(()=>$('name').focus(),40)}function closeModal(){$('backdrop').classList.remove('show')}function toast(text){$('toast').textContent=text;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1900)}$('type').onchange=()=>{$('dueWrap').style.display=$('type').value==='task'?'block':'none'};$('create').onclick=()=>openModal();$('addTask').onclick=()=>openModal({type:'task',date:selected});$('close').onclick=closeModal;$('backdrop').onclick=e=>{if(e.target===$('backdrop'))closeModal()};$('entryForm').onsubmit=e=>{e.preventDefault();const id=$('entryId').value;const obj={id:id||crypto.randomUUID(),name:$('name').value.trim(),type:$('type').value,date:$('date').value,time:$('time').value,due:$('type').value==='task'?($('due').value||$('date').value):'',notes:$('notes').value.trim(),done:id?(items.find(i=>i.id===id)?.done||false):false};if(id)items=items.map(i=>i.id===id?obj:i);else items.push(obj);save();closeModal();cursor=new Date(obj.date+'T00:00:00');selected=obj.date;render();toast(id?'已更新項目':'已新增項目')};$('delete').onclick=()=>{const id=$('entryId').value;if(id&&confirm('確定刪除此項目？')){items=items.filter(x=>x.id!==id);save();closeModal();render();toast('已刪除項目')}};$('prev').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);render()};$('next').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);render()};document.querySelectorAll('.view-toggle button').forEach(b=>b.onclick=()=>{view=b.dataset.view;$('calendarView').style.display=view==='calendar'?'block':'none';$('listView').style.display=view==='list'?'block':'none';document.querySelectorAll('.view-toggle button').forEach(v=>v.classList.toggle('active',v===b));renderList()});$('showAll').onclick=()=>{view='list';$('calendarView').style.display='none';$('listView').style.display='block';document.querySelectorAll('.view-toggle button').forEach(v=>v.classList.toggle('active',v.dataset.view==='list'));renderList()};initDate();render();})();
</script></body></html>
